<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Собеседование — карточки вопросов</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f172a;--card:#1e293b;--card2:#334155;--text:#e2e8f0;--muted:#94a3b8;
  --primary:#6366f1;--primary-d:#4f46e5;--green:#22c55e;--green-d:#16a34a;
  --radius:14px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
#app{width:100%;max-width:900px;margin:0 auto}
.screen{display:none;animation:fade .3s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* START SCREEN */
.header{text-align:center;margin-bottom:24px}
.header h1{font-size:1.6rem;margin-bottom:6px}
.header p{color:var(--muted);font-size:.9rem}

.count-section{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:20px}
.count-section label{font-size:1rem;font-weight:600;display:block;margin-bottom:10px}
.btn-group{display:flex;flex-wrap:wrap;gap:8px}
.btn-opt{
  flex:1;min-width:60px;padding:11px 14px;border:2px solid var(--card2);background:var(--card2);
  color:var(--text);border-radius:10px;font-size:.88rem;cursor:pointer;transition:all .15s;text-align:center;
}
.btn-opt:hover{border-color:var(--primary)}
.btn-opt.selected{border-color:var(--primary);background:var(--primary-d);color:#fff;font-weight:600}

.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.cat-card{
  background:var(--card);border:2px solid var(--card2);border-radius:var(--radius);padding:18px 16px;
  cursor:pointer;transition:all .2s;position:relative;overflow:hidden;
}
.cat-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 4px 12px rgba(99,102,241,.2)}
.cat-card .cat-name{font-size:1rem;font-weight:700;margin-bottom:4px}
.cat-card .cat-count{font-size:.82rem;color:var(--muted)}
.cat-card .cat-icon{font-size:1.5rem;margin-bottom:8px;display:block}

/* QUIZ SCREEN */
.progress-wrap{margin-bottom:14px}
.progress-bar{height:8px;background:var(--card);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--primary);transition:width .3s;border-radius:4px}
.progress-text{font-size:.83rem;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}

.q-card{background:var(--card);border-radius:var(--radius);padding:28px 24px}
.q-badges{margin-bottom:16px;display:flex;flex-wrap:wrap;gap:6px}
.q-badge{display:inline-block;background:var(--primary-d);color:#fff;padding:3px 11px;border-radius:20px;font-size:.76rem}
.q-badge.tag{background:var(--card2);color:var(--muted)}
.q-text{font-size:1.15rem;line-height:1.6;margin-bottom:24px;font-weight:500}

.q-answer{
  margin-top:8px;padding:20px;background:var(--bg);border-radius:10px;border-left:4px solid var(--green);
  animation:fade .3s ease;
}
.q-answer-label{font-size:.82rem;color:var(--green);font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.q-answer-text{font-size:1rem;line-height:1.6;color:var(--text);white-space:pre-line}
.q-explanation{margin-top:14px;padding-top:14px;border-top:1px solid var(--card2);font-size:.9rem;color:var(--muted);line-height:1.5}
.q-explanation strong{color:var(--text)}

.q-nav{margin-top:24px;display:flex;gap:12px}
.btn-nav{
  flex:1;padding:14px;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s;
}
.btn-show{background:var(--primary);color:#fff}
.btn-show:hover{background:var(--primary-d)}
.btn-next{background:var(--green);color:#fff}
.btn-next:hover{background:var(--green-d)}
.btn-exit{background:var(--card2);color:var(--muted);flex:0 0 auto;padding:14px 18px}
.btn-exit:hover{background:var(--card);color:var(--text)}

/* RESULTS SCREEN */
.results-card{background:var(--card);border-radius:var(--radius);padding:28px 24px;text-align:center}
.results-title{font-size:1.4rem;margin-bottom:8px}
.results-sub{color:var(--muted);font-size:.95rem;margin-bottom:24px}
.btn-restart{
  width:100%;padding:16px;background:var(--primary);color:#fff;border:none;border-radius:12px;
  font-size:1.1rem;font-weight:700;cursor:pointer;transition:background .2s;
}
.btn-restart:hover{background:var(--primary-d)}

@media(max-width:520px){
  .header h1{font-size:1.3rem}
  .q-card{padding:20px 16px}
  .q-text{font-size:1.05rem}
  .cards-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .cat-card{padding:14px 12px}
}
</style>
</head>
<body>
<div id="app">

  <!-- START SCREEN -->
  <div id="screen-start" class="screen active">
    <div class="header">
      <h1>🎓 Собеседование IT</h1>
      <p>Выбери направление и количество вопросов</p>
    </div>
    <div class="count-section">
      <label>Сколько вопросов за раунд?</label>
      <div class="btn-group" id="count-group">
        <button class="btn-opt" data-count="5">5</button>
        <button class="btn-opt" data-count="10">10</button>
        <button class="btn-opt" data-count="15">15</button>
        <button class="btn-opt" data-count="20">20</button>
        <button class="btn-opt" data-count="30">30</button>
        <button class="btn-opt" data-count="40">40</button>
        <button class="btn-opt" data-count="50">50</button>
        <button class="btn-opt selected" data-count="0">Все</button>
      </div>
    </div>
    <div class="cards-grid" id="cards-grid"></div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="screen-quiz" class="screen">
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-text">
        <span id="progress-label">Вопрос 1 из 10</span>
        <span id="progress-category">Категория</span>
      </div>
    </div>
    <div class="q-card">
      <div class="q-badges" id="q-badges"></div>
      <div class="q-text" id="q-text">Вопрос</div>
      <div id="q-answer-container"></div>
      <div class="q-nav">
        <button class="btn-nav btn-show" id="btn-show">Показать ответ</button>
        <button class="btn-nav btn-next" id="btn-next" style="display:none">Далее →</button>
        <button class="btn-nav btn-exit" id="btn-exit">✕</button>
      </div>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="screen-results" class="screen">
    <div class="results-card">
      <div class="results-title">✅ Раунд завершён!</div>
      <div class="results-sub" id="results-sub">Вы прошли N вопросов</div>
      <button class="btn-restart" id="btn-restart">← К категориям</button>
    </div>
  </div>

</div>

<script>
// ===== UNREGISTER ANY OLD SERVICE WORKERS =====
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => r.unregister());
  });
}

// ===== STATE =====
let ALL_QUESTIONS = [];
let selectedCount = 0;
let selectedCategory = null;
let quizQuestions = [];
let currentIndex = 0;
let answerShown = false;

// ===== INIT =====
async function loadQuestions() {
  try {
    const resp = await fetch('questions.json');
    if (resp.ok) {
      const data = await resp.json();
      if (data.questions && data.questions.length > 0) {
        ALL_QUESTIONS = data.questions;
      }
    }
  } catch(e) {}
  if (ALL_QUESTIONS.length === 0) {
    document.getElementById('screen-start').innerHTML = '<div class="header"><h1>Ошибка загрузки</h1><p>Не удалось загрузить questions.json. Запустите локальный сервер: <code>python3 -m http.server 8080</code></p></div>';
    return;
  }
  buildCategoryCards();
}

// ===== CATEGORY CARDS =====
function buildCategoryCards() {
  const counts = {};
  ALL_QUESTIONS.forEach(q => {
    const cat = q.category || 'Прочее';
    counts[cat] = (counts[cat] || 0) + 1;
  });

  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);

  // Group by prefix for icons
  const icons = {
    'Backend Java': '☕', 'Backend Go': '🐹', 'Backend Python': '🐍', 'Backend C#': '🔷',
    'Backend C++': '⚡', 'Backend Rust': '🦀', 'Backend PHP': '🐘', 'Backend Node.js': '🟢',
    'Backend (прочее)': '⚙️', 'Frontend React': '⚛️', 'Frontend Vue': '💚', 'Frontend (прочее)': '🎨',
    'Fullstack': '🔗', 'DevOps': '🚀', 'SRE': '📊', 'Sysadmin': '🖥️', 'QA Manual': '🐞',
    'QA Automation': '🤖', 'Mobile Android': '🤖', 'Mobile iOS': '🍎', 'Mobile React Native': '📱',
    'Data Engineer': '🔧', 'Data Analyst': '📈', 'Data Scientist': '🔬', 'ML Engineer': '🧠',
    'Security': '🔒', '1C': '1️⃣', 'Embedded': '🔌', 'System Analyst': '📋', 'Бизнес-аналитик': '💼',
    'Product Manager': '📦', 'Engineering Manager': '👥', 'Tech Support': '🎧', 'UX/UI Designer': '✏️',
    'Low-code': '🧩',
  };

  const container = document.getElementById('cards-grid');
  container.innerHTML = '';

  // Add "All" card first
  const allCard = document.createElement('div');
  allCard.className = 'cat-card';
  allCard.innerHTML = '<span class="cat-icon">📚</span><div class="cat-name">Все вопросы</div><div class="cat-count">' + ALL_QUESTIONS.length + ' вопросов</div>';
  allCard.addEventListener('click', () => startQuiz(null));
  container.appendChild(allCard);

  sorted.forEach(([cat, cnt]) => {
    const card = document.createElement('div');
    card.className = 'cat-card';
    const icon = icons[cat] || '📌';
    card.innerHTML = '<span class="cat-icon">' + icon + '</span><div class="cat-name">' + cat + '</div><div class="cat-count">' + cnt + ' вопросов</div>';
    card.addEventListener('click', () => startQuiz(cat));
    container.appendChild(card);
  });
}

// ===== HELPERS =====
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===== START SCREEN EVENTS =====
document.getElementById('count-group').addEventListener('click', e => {
  if (e.target.classList.contains('btn-opt')) {
    document.querySelectorAll('#count-group .btn-opt').forEach(b => b.classList.remove('selected'));
    e.target.classList.add('selected');
    selectedCount = parseInt(e.target.dataset.count);
  }
});

// ===== START QUIZ =====
function startQuiz(category) {
  selectedCategory = category;
  let pool = ALL_QUESTIONS;
  if (category) {
    pool = ALL_QUESTIONS.filter(q => q.category === category);
  }
  if (pool.length === 0) {
    alert('Нет вопросов в этой категории.');
    return;
  }
  pool = shuffle(pool);
  quizQuestions = selectedCount === 0 ? pool : pool.slice(0, Math.min(selectedCount, pool.length));
  currentIndex = 0;
  showScreen('screen-quiz');
  renderQuestion();
}

// ===== QUIZ SCREEN =====
function renderQuestion() {
  const q = quizQuestions[currentIndex];
  answerShown = false;

  const pct = (currentIndex / quizQuestions.length) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = 'Вопрос ' + (currentIndex + 1) + ' из ' + quizQuestions.length;
  document.getElementById('progress-category').textContent = q.category || '';

  // Badges
  var badgesDiv = document.getElementById('q-badges');
  badgesDiv.innerHTML = '';
  if (q.tags) {
    q.tags.forEach(function(t) {
      var tagBadge = document.createElement('span');
      tagBadge.className = 'q-badge tag';
      tagBadge.textContent = t;
      badgesDiv.appendChild(tagBadge);
    });
  }

  document.getElementById('q-text').textContent = q.question;

  // Reset answer area
  document.getElementById('q-answer-container').innerHTML = '';
  document.getElementById('btn-show').style.display = '';
  document.getElementById('btn-next').style.display = 'none';

  var btnNext = document.getElementById('btn-next');
  btnNext.textContent = currentIndex === quizQuestions.length - 1 ? 'Завершить ✓' : 'Далее →';
}

document.getElementById('btn-show').addEventListener('click', function() {
  if (answerShown) return;
  answerShown = true;
  var q = quizQuestions[currentIndex];

  var container = document.getElementById('q-answer-container');
  container.innerHTML = '';

  var answerBox = document.createElement('div');
  answerBox.className = 'q-answer';

  var answerLabel = document.createElement('div');
  answerLabel.className = 'q-answer-label';
  answerLabel.textContent = 'Ответ';
  answerBox.appendChild(answerLabel);

  var answerText = document.createElement('div');
  answerText.className = 'q-answer-text';
  answerText.textContent = q.answer || '';
  answerBox.appendChild(answerText);

  if (q.explanation && q.explanation.trim()) {
    var explanation = document.createElement('div');
    explanation.className = 'q-explanation';
    var explanationLabel = document.createElement('strong');
    explanationLabel.textContent = 'Пояснение: ';
    explanation.appendChild(explanationLabel);
    explanation.appendChild(document.createTextNode(q.explanation));
    answerBox.appendChild(explanation);
  }

  container.appendChild(answerBox);

  document.getElementById('btn-show').style.display = 'none';
  document.getElementById('btn-next').style.display = '';
});

document.getElementById('btn-next').addEventListener('click', function() {
  currentIndex++;
  if (currentIndex >= quizQuestions.length) {
    showResults();
  } else {
    renderQuestion();
  }
});

document.getElementById('btn-exit').addEventListener('click', function() {
  if (confirm('Выйти к категориям?')) {
    showScreen('screen-start');
  }
});

// ===== RESULTS SCREEN =====
function showResults() {
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('results-sub').textContent = 'Вы прошли ' + quizQuestions.length + ' вопросов по категории "' + (selectedCategory || 'Все') + '"';
  showScreen('screen-results');
}

document.getElementById('btn-restart').addEventListener('click', function() {
  showScreen('screen-start');
});

// ===== START =====
loadQuestions();
</script>
</body>
</html>
